name: PocketForge QA
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verificar sintaxe JavaScript
        run: node --check demo/game.js
      - name: Executar testes da toolchain
        run: python3 -m unittest discover -s tests -v
      - name: Validar parsers JavaScript Java-free (fixtures sintéticas)
        run: node --test tests/gameloft_*.test.cjs tests/zip_jar.test.cjs
      - name: Auditar tamanho do jogo
        run: python3 scripts/audit.py demo --max-bytes 1048576
      - name: Validar manifestos JSON
        run: |
          python3 -m json.tool examples/pocketforge.json > /dev/null
          python3 -m json.tool schemas/pocketforge.schema.json > /dev/null

  browser-smoke:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Playwright e navegador Chromium
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Smoke real desktop/touch
        run: python3 tests/browser_smoke.py
        env:
          POCKETFORGE_SCREENSHOT_DIR: artifacts/browser
      - name: Smoke JAR binário aberto no navegador (sem JVM)
        run: python3 tests/browser_gameloft_smoke.py
        env:
          POCKETFORGE_SCREENSHOT_DIR: artifacts/browser
      - name: Salvar capturas de evidência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketforge-browser-screenshots
          path: artifacts/browser/
          if-no-files-found: ignore
