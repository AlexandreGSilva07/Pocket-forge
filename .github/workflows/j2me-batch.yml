name: PocketForge J2ME batch ledger (100 JARs)
on:
  push:
    branches:
      - research/j2me-corpus-lote01
      - 'audit/j2me-batch-*'
    paths:
      - scripts/audit_j2me_batch.py
      - .github/workflows/j2me-batch.yml
      - config/j2me-batch.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pocketforge-j2me-batch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set batch number from versioned configuration
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          cfg=json.load(open("config/j2me-batch.json", encoding="utf-8"))
          batch=cfg["batch"]
          if type(batch) is not int or batch < 1 or batch > 1000: raise ValueError("invalid batch")
          print(f"BATCH_NUMBER={batch}")
          PY
      - name: Download source archive (never commit JAR/JAD)
        shell: bash
        run: |
          set -euo pipefail
          URL="https://archive.org/download/1000_J2ME_Games_Pack/1000JavaGames.zip"
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 900 --silent --show-error "$URL" --output "$RUNNER_TEMP/1000JavaGames.zip"
          python3 - "$RUNNER_TEMP/1000JavaGames.zip" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z: print("ZIP verified; outer entries:",len(z.infolist()))
          PY
      - name: Audit exactly 100 unique JARs and update persistent ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_j2me_batch.py "$RUNNER_TEMP/1000JavaGames.zip" --batch "$BATCH_NUMBER" --out docs/research/batches
          cat "docs/research/batches/$(printf '%03d' "$BATCH_NUMBER").md" >> "$GITHUB_STEP_SUMMARY"
      - name: Engine unit tests and JavaScript syntax
        shell: bash
        run: |
          node --check demo/engine/compact.js
          node --check demo/game.js
          node --test tests/compact_engine.test.cjs
          python3 -m unittest discover -s tests -v
      - name: Commit audit results into PR branch (permanent)
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pocketforge-audit-bot"
          git config user.email "pocketforge-audit-bot@users.noreply.github.com"
          git add docs/research/batches/
          if ! git diff --cached --quiet; then
            git commit -m "research(batch ${BATCH_NUMBER}): registrar 100 arquivos e métricas verificáveis"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j2me-audit-batch-${{ env.BATCH_NUMBER }}
          path: docs/research/batches/
          if-no-files-found: warn
          retention-days: 30
